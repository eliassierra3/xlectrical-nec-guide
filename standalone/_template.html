<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #eceef1;
    --border: #dfe2e7;
    --text: #191c22;
    --muted: #5e6572;
    --brand: #7c3aed;
    --brand-strong: #6d28d9;
    --brand-soft: #f1ecfd;
    --accent: #f59e0b;
    --accent-2: #fbbf24;
    --ring: rgba(124, 58, 237, 0.28);
    --tip: #15803d;      --tip-bg: #eefaf1;      --tip-bd: #bfe8cc;
    --note: #1d4ed8;     --note-bg: #eef3fe;     --note-bd: #cdddfb;
    --warn: #b45309;     --warn-bg: #fdf5e7;     --warn-bd: #f4dfae;
    --imp: #be185d;      --imp-bg: #fdeef5;      --imp-bd: #f6c9dd;
    --hl-bg: #ecfdf3;    --hl-bd: #b6e6c6;       --hl-tx: #14663a;
    --shadow: 0 1px 2px rgba(15, 20, 30, .05), 0 8px 24px -14px rgba(20, 25, 40, .16);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216;
      --surface: #171b21;
      --surface-2: #1f242c;
      --border: #2a303a;
      --text: #e7eaee;
      --muted: #98a0ac;
      --brand: #a78bfa;
      --brand-strong: #8b5cf6;
      --brand-soft: #241f36;
      --accent: #fbbf24;
      --accent-2: #fcd34d;
      --ring: rgba(167, 139, 250, 0.35);
      --tip: #4ade80;   --tip-bg: #11241a;   --tip-bd: #1f4a30;
      --note: #93b4fc;  --note-bg: #141c2e;  --note-bd: #26406e;
      --warn: #fbbf24;  --warn-bg: #251d10;  --warn-bd: #463514;
      --imp: #f472b6;   --imp-bg: #281320;   --imp-bd: #4a2036;
      --hl-bg: #0f2318; --hl-bd: #1e5033;    --hl-tx: #6ee7a0;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="light"] {
    --bg: #f4f5f7; --surface: #ffffff; --surface-2: #eceef1; --border: #dfe2e7;
    --text: #191c22; --muted: #5e6572; --brand: #7c3aed; --brand-strong: #6d28d9;
    --brand-soft: #f1ecfd; --accent: #f59e0b; --accent-2: #fbbf24; --ring: rgba(124,58,237,.28);
    --tip:#15803d;--tip-bg:#eefaf1;--tip-bd:#bfe8cc;--note:#1d4ed8;--note-bg:#eef3fe;--note-bd:#cdddfb;
    --warn:#b45309;--warn-bg:#fdf5e7;--warn-bd:#f4dfae;--imp:#be185d;--imp-bg:#fdeef5;--imp-bd:#f6c9dd;
    --hl-bg:#ecfdf3;--hl-bd:#b6e6c6;--hl-tx:#14663a;
    --shadow: 0 1px 2px rgba(15,20,30,.05), 0 8px 24px -14px rgba(20,25,40,.16);
  }
  :root[data-theme="dark"] {
    --bg:#0f1216;--surface:#171b21;--surface-2:#1f242c;--border:#2a303a;--text:#e7eaee;--muted:#98a0ac;
    --brand:#a78bfa;--brand-strong:#8b5cf6;--brand-soft:#241f36;--accent:#fbbf24;--accent-2:#fcd34d;--ring:rgba(167,139,250,.35);
    --tip:#4ade80;--tip-bg:#11241a;--tip-bd:#1f4a30;--note:#93b4fc;--note-bg:#141c2e;--note-bd:#26406e;
    --warn:#fbbf24;--warn-bg:#251d10;--warn-bd:#463514;--imp:#f472b6;--imp-bg:#281320;--imp-bd:#4a2036;
    --hl-bg:#0f2318;--hl-bd:#1e5033;--hl-tx:#6ee7a0;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--ring); }

  /* ---------- Layout shell ---------- */
  .app { display: flex; min-height: 100%; }
  .sidebar {
    width: 264px; flex: 0 0 264px; background: var(--surface);
    border-right: 1px solid var(--border);
    position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 40;
  }
  .content { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 10px; }
  .brand img { height: 30px; width: auto; }
  .brand .sub { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .nav { padding: 8px 10px 24px; display: flex; flex-direction: column; gap: 2px; }
  .nav .group { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    font-weight: 700; padding: 14px 10px 6px; }
  .navlink { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px;
    color: var(--text); font-size: 14px; font-weight: 500; }
  .navlink:hover { background: var(--surface-2); }
  .navlink.active { background: var(--brand-soft); color: var(--brand-strong); font-weight: 650; }
  .navlink .n { width: 22px; height: 22px; flex: 0 0 22px; border-radius: 6px; display: grid; place-items: center;
    font-size: 11px; font-weight: 800; background: var(--surface-2); color: var(--muted); }
  .navlink.active .n { background: var(--brand); color: #fff; }
  .navlink .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Topbar ---------- */
  .topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--border); }
  .menu-btn { display: none; }
  .icon-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text);
    width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; cursor: pointer; }
  .icon-btn:hover { border-color: var(--brand); color: var(--brand-strong); }
  .search { position: relative; flex: 1 1 auto; max-width: 560px; }
  .search input { width: 100%; height: 40px; padding: 0 14px 0 40px; border-radius: 11px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; outline: none; }
  .search input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--ring); }
  .search .s-ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .results { position: absolute; top: 46px; left: 0; right: 0; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; z-index: 50; }
  .results a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .results a:last-child { border-bottom: 0; }
  .results a:hover { background: var(--surface-2); }
  .results .r-ref { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--brand-strong);
    background: var(--brand-soft); padding: 2px 7px; border-radius: 6px; flex: 0 0 auto; }
  .results .r-t { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .results .r-empty { padding: 14px; color: var(--muted); font-size: 13px; }
  .spacer { flex: 1 1 auto; }
  .lang-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .lang-toggle button { border: 0; background: transparent; color: var(--muted); font-weight: 700; font-size: 12px;
    padding: 8px 12px; cursor: pointer; }
  .lang-toggle button.on { background: var(--brand); color: #fff; }

  /* ---------- Main / views ---------- */
  main { padding: 26px 28px 40px; max-width: 1080px; width: 100%; margin: 0 auto; }
  .crumb { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 600;
    margin-bottom: 16px; }
  .crumb:hover { color: var(--brand-strong); }
  .page-head { margin-bottom: 22px; }
  .page-head .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  h1.title { font-size: 27px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -.01em; text-wrap: balance; }
  .subtitle { color: var(--muted); font-size: 15.5px; margin: 0; max-width: 68ch; }

  .badge { display: inline-flex; align-items: center; font-family: var(--mono); font-size: 11.5px; font-weight: 700;
    color: var(--brand-strong); background: var(--brand-soft); border: 1px solid var(--note-bd); padding: 3px 8px; border-radius: 7px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); background: var(--surface); }
  .chip.checklist { color: var(--tip); background: var(--tip-bg); border-color: var(--tip-bd); }
  .chip.table { color: var(--note); background: var(--note-bg); border-color: var(--note-bd); }
  .chip.requirements { color: var(--imp); background: var(--imp-bg); border-color: var(--imp-bd); }
  .chip.reference { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-bd); }

  /* Audience filter + tags (Residential / Commercial) */
  .filterbar { display: flex; align-items: center; gap: 10px; margin: 2px 0 18px; flex-wrap: wrap; }
  .filterbar .lbl { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 11px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: transparent; color: var(--muted); font-weight: 650; font-size: 13px; padding: 8px 15px; cursor: pointer; }
  .seg button.on { background: var(--brand); color: #fff; }
  .seg button:not(.on):hover { background: var(--surface-2); }
  .aud { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .03em;
    text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); background: var(--surface); }
  .aud .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .aud .dot.res { background: #0d9488; } .aud .dot.com { background: var(--accent); }

  /* ---------- Hero ---------- */
  .hero { position: relative; overflow: hidden; border: 1px solid var(--border); border-radius: 20px; padding: 30px; margin-bottom: 26px;
    background: radial-gradient(680px 220px at 108% -30%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 62%), var(--surface);
    box-shadow: var(--shadow); }
  .hero::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--brand-strong), var(--brand), var(--accent)); }
  .hero h1 { font-size: 30px; margin: 4px 0 8px; letter-spacing: -.02em; text-wrap: balance; }
  .hero p { color: var(--muted); font-size: 16px; margin: 0 0 18px; max-width: 60ch; }
  .hero .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--brand-strong); }

  /* ---------- Cards grid ---------- */
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); }
  .card { display: block; border: 1px solid var(--border); background: var(--surface); border-radius: 15px; padding: 16px;
    box-shadow: var(--shadow); transition: transform .12s ease, border-color .12s ease; }
  .card:hover { transform: translateY(-2px); border-color: var(--brand); }
  .card .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .card .num { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-weight: 800;
    color: #fff; background: linear-gradient(135deg, var(--brand-strong), var(--brand)); font-size: 14px; }
  .card h3 { font-size: 15.5px; margin: 10px 0 4px; line-height: 1.3; }
  .card p { font-size: 13px; color: var(--muted); margin: 0; }
  .card .badge { margin-top: 2px; }
  .card .card-tags { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0 2px; }
  .section-title { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    margin: 30px 0 12px; }

  /* ---------- Blocks ---------- */
  .block { position: relative; margin: 16px 0; }
  .block-inner > :first-child { margin-top: 0; }
  .tr-btn { position: absolute; top: 0; right: 0; display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 700; color: var(--brand-strong); background: var(--brand-soft);
    border: 1px solid var(--note-bd); border-radius: 999px; padding: 3px 10px 3px 8px; cursor: pointer; z-index: 2; opacity: .55; transition: opacity .12s; }
  .block:hover .tr-btn, .tr-btn:focus-visible { opacity: 1; }
  .tr-btn:hover { background: var(--brand); color: #fff; border-color: var(--brand); }
  .tr-btn svg { width: 13px; height: 13px; }

  .blk-h { font-size: 17px; font-weight: 750; margin: 8px 0 2px; color: var(--text); padding-right: 96px; }
  .blk-p { margin: 0; font-size: 15.5px; color: var(--text); padding-right: 96px; }
  .blk-list { margin: 4px 0; padding-left: 0; list-style: none; display: grid; gap: 7px; }
  .blk-list li { position: relative; padding-left: 24px; font-size: 15px; }
  .blk-list li::before { content: ""; position: absolute; left: 4px; top: 9px; width: 7px; height: 7px; border-radius: 2px;
    background: var(--brand); transform: rotate(45deg); }

  .callout { border: 1px solid var(--note-bd); border-left-width: 4px; background: var(--note-bg); border-radius: 10px;
    padding: 12px 14px 12px 16px; display: flex; gap: 12px; align-items: flex-start; padding-right: 96px; }
  .callout .k { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 2px 0;
    flex: 0 0 auto; }
  .callout p { margin: 0; font-size: 14.5px; }
  .callout.tip { border-color: var(--tip-bd); background: var(--tip-bg); } .callout.tip .k { color: var(--tip); } .callout.tip { border-left-color: var(--tip); }
  .callout.note { border-color: var(--note-bd); background: var(--note-bg); } .callout.note .k { color: var(--note); } .callout.note { border-left-color: var(--note); }
  .callout.warning { border-color: var(--warn-bd); background: var(--warn-bg); } .callout.warning .k { color: var(--warn); } .callout.warning { border-left-color: var(--warn); }
  .callout.important { border-color: var(--imp-bd); background: var(--imp-bg); } .callout.important .k { color: var(--imp); } .callout.important { border-left-color: var(--imp); }

  .steps { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); padding: 14px 16px; padding-right: 96px; }
  .steps .steps-t { font-weight: 750; font-size: 14px; margin-bottom: 10px; color: var(--brand-strong); }
  .steps ol { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 9px; }
  .steps li { counter-increment: s; position: relative; padding-left: 34px; font-size: 14.5px; min-height: 24px; }
  .steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 7px;
    background: var(--brand-soft); color: var(--brand-strong); font-weight: 800; font-size: 12px; display: grid; place-items: center; }

  /* ---------- Tables ---------- */
  .tbl { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); overflow: hidden; box-shadow: var(--shadow); }
  .tbl-head { padding: 15px 16px 12px; border-bottom: 1px solid var(--border); }
  .tbl-head h3 { margin: 8px 0 4px; font-size: 16.5px; }
  .tbl-head p { margin: 0; font-size: 13.5px; color: var(--muted); max-width: 74ch; }
  .tbl-tools { padding: 10px 16px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--border); }
  .tbl-filter { flex: 1 1 auto; height: 34px; border: 1px solid var(--border); background: var(--bg); color: var(--text);
    border-radius: 9px; padding: 0 12px; font-size: 13px; outline: none; max-width: 320px; }
  .tbl-filter:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--ring); }
  .tbl-count { font-size: 12px; color: var(--muted); }
  .scroll-x { overflow-x: auto; }
  table.data { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  table.data th, table.data td { padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: center; white-space: nowrap; }
  table.data thead th { position: sticky; top: 0; background: var(--surface-2); color: var(--muted); font-size: 11.5px;
    text-transform: uppercase; letter-spacing: .04em; font-weight: 750; z-index: 1; }
  table.data td.al-left, table.data th.al-left { text-align: left; white-space: normal; }
  table.data tbody tr:hover td { background: var(--surface-2); }
  table.data tr.hl td { background: var(--hl-bg); color: var(--hl-tx); font-weight: 650; }
  table.data tr.hl td:first-child { box-shadow: inset 3px 0 0 var(--tip); }
  table.data tr.hidden { display: none; }
  .tbl-notes { padding: 6px 16px 16px; display: grid; gap: 10px; }

  .diagram { margin: 6px 0; border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
  .diagram svg { width: 100%; height: auto; max-width: 660px; display: block; margin: 0 auto; font-family: var(--sans); }
  .diagram figcaption { text-align: center; color: var(--muted); font-size: 13px; margin-top: 10px; }

  /* Calculators */
  .calc { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 760px){ .calc { grid-template-columns: 1fr; } }
  .calc-form { border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
  .calc-label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 6px; }
  .calc select, .calc input { font-family: inherit; font-size: 14px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 9px; padding: 8px 10px; outline: none; }
  .calc select:focus, .calc input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--ring); }
  #calc-conduit { width: 100%; margin-bottom: 14px; }
  .calc-rows-head { display: grid; grid-template-columns: 1fr 88px 34px; gap: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); padding: 0 2px 6px; }
  .calc-row { display: grid; grid-template-columns: 1fr 88px 34px; gap: 8px; margin-bottom: 8px; }
  .calc-row select, .calc-row .calc-qty { width: 100%; }
  .calc-row .calc-qty { text-align: center; }
  .calc-del { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 9px; cursor: pointer; font-size: 13px; }
  .calc-del:hover { border-color: var(--imp); color: var(--imp); }
  .calc-add { margin-top: 6px; border: 1px dashed var(--brand); background: var(--brand-soft); color: var(--brand-strong); border-radius: 9px; padding: 9px 12px; font-weight: 700; font-size: 13px; cursor: pointer; width: 100%; }
  .calc-add:hover { background: var(--brand); color: #fff; }
  .calc-result { border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); position: sticky; top: 74px; }
  .cr-min { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .cr-cap { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .cr-big { font-size: 46px; font-weight: 800; color: var(--brand-strong); line-height: 1.05; }
  .cr-bar { height: 12px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 16px 0 8px; }
  .cr-bar-fill { height: 100%; background: linear-gradient(90deg, var(--tip), var(--brand)); border-radius: 99px; transition: width .2s ease; }
  .cr-stats { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--text); }
  .cr-stats b { color: var(--brand-strong); font-variant-numeric: tabular-nums; }
  .cr-empty, .cr-fail { color: var(--muted); font-size: 14px; text-align: center; padding: 22px 6px; }
  .cr-fail .cr-big { color: var(--imp); font-size: 30px; }
  .calc-note { margin-top: 14px; font-size: 12.5px; color: var(--muted); max-width: 80ch; }
  .calc-preset { width: 100%; margin-bottom: 14px; font-weight: 600; }
  .calc-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .calc-two select { width: 100%; }
  .calc-egc { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); font-size: 13px; color: var(--muted); }
  .calc-egc-lbl { font-weight: 600; }
  .calc-egc-amps { width: 74px; text-align: center; }
  .calc-egc b { color: var(--tip); font-variant-numeric: tabular-nums; }
  .calc-egc-add { border: 1px solid var(--tip); background: var(--tip-bg); color: var(--tip); border-radius: 8px; padding: 6px 10px; font-weight: 700; font-size: 12.5px; cursor: pointer; margin-left: auto; }
  .calc-egc-add:hover { background: var(--tip); color: #fff; }
  .cr-sizes-cap { margin: 16px 0 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .cr-sizes { display: grid; gap: 5px; }

// Conductor approximate areas (in^2) — NEC Chapter 9, Table 5 (verified vs NEC 2023)
var INSULATION = {
  thhn: { name: { en:'THHN / THWN-2', es:'THHN / THWN-2' }, area: { '14':0.0097,'12':0.0133,'10':0.0211,'8':0.0366,'6':0.0507,'4':0.0824,'3':0.0973,'2':0.1158,'1':0.1562,'1/0':0.1855,'2/0':0.2223,'3/0':0.2679,'4/0':0.3237,'250':0.3970,'300':0.4608,'350':0.5242,'400':0.5863,'500':0.7073 } }
};
// Conduit total internal areas (in^2) — NEC Chapter 9, Table 4
var CONDUIT = {
  pvc40: { name: { en:'PVC Schedule 40', es:'PVC Cédula 40' }, sizes: [['1/2',0.285],['3/4',0.508],['1',0.832],['1-1/4',1.453],['1-1/2',1.986],['2',3.291],['2-1/2',4.695],['3',7.268],['3-1/2',9.737],['4',12.554]] },
  pvc80: { name: { en:'PVC Schedule 80', es:'PVC Cédula 80' }, sizes: [['1/2',0.217],['3/4',0.409],['1',0.688],['1-1/4',1.237],['1-1/2',1.711],['2',2.874],['2-1/2',4.119],['3',6.442],['3-1/2',8.688],['4',11.258]] },
  emt:   { name: { en:'EMT', es:'EMT' }, sizes: [['1/2',0.304],['3/4',0.533],['1',0.864],['1-1/4',1.496],['1-1/2',2.036],['2',3.356],['2-1/2',5.858],['3',8.846],['3-1/2',11.545],['4',14.753]] },
  rmc:   { name: { en:'RMC (rigid metal)', es:'RMC (metálico rígido)' }, sizes: [['1/2',0.314],['3/4',0.549],['1',0.887],['1-1/4',1.526],['1-1/2',2.071],['2',3.408],['2-1/2',4.866],['3',7.499],['3-1/2',10.010],['4',12.882]] },
  imc:   { name: { en:'IMC', es:'IMC' }, sizes: [['1/2',0.342],['3/4',0.586],['1',0.959],['1-1/4',1.647],['1-1/2',2.225],['2',3.630],['2-1/2',5.135],['3',7.922],['3-1/2',10.584],['4',13.631]] }
};
// Equipment grounding conductor (Cu) by OCPD rating — NEC Table 250.122
var EGC_122 = [[15,'14'],[20,'12'],[60,'10'],[100,'8'],[200,'6'],[300,'4'],[400,'3'],[500,'2'],[600,'1'],[800,'1/0'],[1000,'2/0'],[1200,'3/0'],[1600,'4/0'],[2000,'250']];
function egcSize(amps){ for (var i=0;i<EGC_122.length;i++){ if (amps <= EGC_122[i][0]) return EGC_122[i][1]; } return '250'; }
var PRESETS = {
  svc200: { label: { en:'200A service — 3× 2/0 + #4 EGC', es:'Acometida 200A — 3× 2/0 + #4 tierra' }, conduit:'pvc40', insulation:'thhn', rows:[{size:'2/0',qty:3},{size:'4',qty:1}] },
  sub100: { label: { en:'100A subpanel — 3× #4 + #8 EGC', es:'Subpanel 100A — 3× #4 + #8 tierra' }, conduit:'pvc40', insulation:'thhn', rows:[{size:'4',qty:3},{size:'8',qty:1}] },
  ev48:   { label: { en:'EV charger 48A — 2× #6 + #10 EGC', es:'Cargador EV 48A — 2× #6 + #10 tierra' }, conduit:'emt', insulation:'thhn', rows:[{size:'6',qty:2},{size:'10',qty:1}] },
  circ20: { label: { en:'20A circuit — 3× #12', es:'Circuito 20A — 3× #12' }, conduit:'emt', insulation:'thhn', rows:[{size:'12',qty:3}] }
};
function computeConduitFill(){
  var areaMap = INSULATION[CALC.insulation].area;
  var totalN = 0, totalArea = 0;
  CALC.rows.forEach(function(r){ var q = r.qty||0; totalN += q; totalArea += q * (areaMap[r.size]||0); });
  var pct = totalN <= 1 ? 0.53 : (totalN === 2 ? 0.31 : 0.40);
  var sizes = CONDUIT[CALC.conduit].sizes;
  var pickIdx = -1;
  var perSize = sizes.map(function(s, i){
    var fill = totalArea > 0 ? totalArea / s[1] * 100 : 0;
    var fits = totalN > 0 && totalArea <= pct * s[1];
    if (fits && pickIdx < 0) pickIdx = i;
    return { size: s[0], fill: fill, fits: fits };
  });
  var pick = pickIdx >= 0 ? perSize[pickIdx] : null;
  var fillPct = pick ? pick.fill : 0;
  var barPct = pick ? (fillPct / (pct * 100) * 100) : 0;
  return { totalN: totalN, totalArea: totalArea, pct: pct, perSize: perSize, pick: pick, pickIdx: pickIdx, fillPct: fillPct, barPct: barPct };
}
function syncCalc(){
  var c = document.getElementById('calc-conduit'); if (c) CALC.conduit = c.value;

  var eg = document.getElementById('calc-egc-amps'); if (eg) CALC.egcAmps = Math.max(15, parseInt(eg.value, 10) || 15);
  var rows = [];
  Array.prototype.forEach.call(document.querySelectorAll('.calc-row'), function(r){
    rows.push({ size: r.querySelector('.calc-size').value, qty: Math.max(1, parseInt(r.querySelector('.calc-qty').value, 10) || 1) });
  });
  if (rows.length) CALC.rows = rows;
}
function renderCalcResult(){
  var el = document.getElementById('calc-result'); if (!el) return;

  if (r.totalN <= 0){ el.innerHTML = '<div class="cr-empty">' + dl(l,'Add at least one conductor.','Agrega al menos un conductor.') + '</div>'; return; }
  var maxPct = Math.round(r.pct * 100);
  var head;
  if (!r.pick){
    head = '<div class="cr-fail"><div class="cr-big">&gt; 4&quot;</div><div>' + dl(l,'Exceeds 4″ conduit — split the run or use a larger raceway.','Excede el conduit de 4″ — divide el tramo o usa una canalización mayor.') + '</div></div>';

      '<span>' + r.totalN + ' ' + dl(l,'conductors','conductores') + ' · ' + r.totalArea.toFixed(3) + ' in²</span></div>';

  var rows = r.perSize.map(function(p, i){
    var cls = 'crs-row' + (i === r.pickIdx ? ' is-min' : '') + (p.fits ? '' : ' is-over');
    var w = Math.min(100, p.fill / maxPct * 100);
    return '<div class="' + cls + '"><span class="crs-size">' + p.size + '&quot;</span>' +

  }).join('');
  el.innerHTML = head + '<div class="cr-sizes-cap">' + dl(l,'Fill at each size','Llenado en cada tamaño') + '</div><div class="cr-sizes">' + rows + '</div>';

function blockInner(b, lang){
  switch(b.type){
    case "heading": return '<h3 class="blk-h">'+esc(tt(b.text,lang))+'</h3>';
    case "paragraph": return '<p class="blk-p">'+esc(tt(b.text,lang))+'</p>';
    case "list": return '<ul class="blk-list">'+b.items.map(function(i){return '<li>'+esc(tt(i,lang))+'</li>';}).join('')+'</ul>';
    case "callout": return '<div class="callout '+b.kind+'"><span class="k">'+esc(ui().kind[b.kind])+'</span><p>'+esc(tt(b.text,lang))+'</p></div>';
    case "steps":
      return '<div class="steps">'+(b.title?'<div class="steps-t">'+esc(tt(b.title,lang))+'</div>':'')+
        '<ol>'+b.steps.map(function(s){return '<li>'+esc(tt(s,lang))+'</li>';}).join('')+'</ol></div>';
    case "comparison": return comparisonHTML(b, lang);
    case "table": var t = TABLE_BY_SLUG[b.tableSlug]; return t ? tableHTML(t, lang) : '';
    case "diagram": var fn = DIAGRAMS[b.diagram]; return fn ? '<figure class="diagram">'+fn(lang)+(b.caption?'<figcaption>'+esc(tt(b.caption,lang))+'</figcaption>':'')+'</figure>' : '';
  }
  return '';
}
function comparisonHTML(b, lang){
  var head = '<tr><th class="rowlabel">'+(b.title?esc(tt(b.title,lang)):'')+'</th>'+
    b.columns.map(function(c){return '<th>'+esc(tt(c,lang))+'</th>';}).join('')+'</tr>';

      r.cells.map(function(c){return '<td>'+esc(tt(c,lang))+'</td>';}).join('')+'</tr>';

  }).join('');
  return '<a class="crumb" href="#/">← '+esc(ui().home)+'</a>'+
    '<div class="page-head"><div class="meta"><span class="num" style="width:34px;height:34px">'+esc(s.number)+'</span>'+
      catChip(s.category)+'<span class="badge">'+esc(s.necRef)+'</span>'+audTag(s.applies)+'</div>'+
      '<h1 class="title">'+esc(tt(s.title,LANG))+'</h1><p class="subtitle">'+esc(tt(s.subtitle,LANG))+'</p></div>'+
    blocksHtml;
}

function tableView(slug){
  var t = TABLE_BY_SLUG[slug];
  if(!t) return '<p>'+esc(ui().noResults)+'</p>';
  viewBlocks = {}; var id = "table-"+slug; viewBlocks[id] = { type:"table", tableSlug:slug };
  return '<a class="crumb" href="#/">← '+esc(ui().home)+'</a>'+
    '<div class="page-head"><div class="meta">'+catChip("table")+'<span class="badge">'+esc(t.necRef)+'</span>'+audTag(t.applies)+'</div></div>'+
    blockWrap(id, viewBlocks[id]);
}

/* ===== Search ===== */
function buildSearchText(item, kind){
  var parts = [tt(item.title,"en"), tt(item.title,"es"), item.necRef, item.category, (item.keywords||[]).join(" ")];
  if(kind==="section"){ parts.push(tt(item.subtitle,"en"), tt(item.subtitle,"es"));
    (item.blocks||[]).forEach(function(b){
      if(b.text){ parts.push(b.text.en, b.text.es); }
      if(b.items){ b.items.forEach(function(i){parts.push(i.en,i.es);}); }
      if(b.steps){ b.steps.forEach(function(s){parts.push(s.en,s.es);}); }
    });
  } else {
    parts.push(tt(item.description,"en"), tt(item.description,"es"));
    (item.rows||[]).forEach(function(r){ Object.keys(r).forEach(function(k){ var v=r[k]; if(v&&typeof v==='object'){parts.push(v.en,v.es);} else {parts.push(v);} }); });
  }
  return parts.join(" ").toLowerCase();
}
var INDEX = [];
SECTIONS.forEach(function(s){ INDEX.push({kind:"section", slug:s.slug, title:s.title, necRef:s.necRef, category:s.category, text:buildSearchText(s,"section")}); });
TABLES.forEach(function(t){ INDEX.push({kind:"table", slug:t.slug, title:t.title, necRef:t.necRef, category:t.category, text:buildSearchText(t,"table")}); });

function searchItems(q){
  q = q.trim().toLowerCase(); if(!q) return [];
  var terms = q.split(/\s+/).slice(0,6);
  return INDEX.map(function(it){
    var title = (tt(it.title,"en")+" "+tt(it.title,"es")).toLowerCase();
    var ref = it.necRef.toLowerCase();
    var ok = terms.every(function(t){ return it.text.indexOf(t)>=0; });
    if(!ok) return null;
    var score = 0;
    if(title.indexOf(q)>=0 || ref.indexOf(q)>=0) score += 100;
    terms.forEach(function(t){ if(ref.indexOf(t)>=0) score+=12; if(title.indexOf(t)>=0) score+=8; else score+=1; });
    return {it:it, score:score};
  }).filter(Boolean).sort(function(a,b){return b.score-a.score;}).slice(0,10).map(function(x){return x.it;});
}
function renderResults(q){
  var box = document.getElementById("results");
  var items = searchItems(q);
  if(!q.trim()){ box.hidden = true; box.innerHTML=""; return; }
  if(!items.length){ box.hidden=false; box.innerHTML='<div class="r-empty">'+esc(ui().noResults)+'</div>'; return; }
  box.hidden = false;
  box.innerHTML = items.map(function(it){
    var href = "#/"+(it.kind==="section"?"section":"table")+"/"+it.slug;
    return '<a href="'+href+'" data-close-results><span class="r-ref">'+esc(it.necRef)+'</span>'+
      '<span class="r-t">'+esc(tt(it.title,LANG))+'</span></a>';
  }).join('');
}

/* ===== Nav ===== */
function renderNav(){
  var route = location.hash || "#/";
  var html = '<a class="navlink'+(route==="#/"||route===""?" active":"")+'" href="#/"><span class="n">⌂</span><span class="t">'+esc(ui().home)+'</span></a>';
  html += '<div class="group">'+esc(ui().guide)+'</div>';
  SECTIONS.forEach(function(s){
    var active = route==="#/section/"+s.slug ? " active" : "";
    html += '<a class="navlink'+active+'" href="#/section/'+s.slug+'"><span class="n">'+esc(s.number)+'</span><span class="t">'+esc(tt(s.title,LANG))+'</span></a>';
  });
  html += '<div class="group">'+dl(LANG,'Calculators','Calculadoras')+'</div>';
  html += '<a class="navlink'+(route.indexOf("#/calc")===0?" active":"")+'" href="#/calc/conduit"><span class="n">∑</span><span class="t">'+dl(LANG,'Conduit Fill','Llenado de conduit')+'</span></a>';
  html += '<div class="group">'+esc(ui().tables)+'</div>';
  TABLES.forEach(function(t){
    var active = route==="#/table/"+t.slug ? " active" : "";
    html += '<a class="navlink'+active+'" href="#/table/'+t.slug+'"><span class="n">▦</span><span class="t">'+esc(tt(t.title,LANG))+'</span></a>';
  });
  document.getElementById("nav").innerHTML = html;
}

/* ===== Router / render ===== */
function render(){
  var h = location.hash || "#/";
  var view = document.getElementById("view");
  overrides = {};
  if(h.indexOf("#/section/")===0){ view.innerHTML = sectionView(h.slice(10)); }
  else if(h.indexOf("#/table/")===0){ view.innerHTML = tableView(h.slice(8)); }
  else if(h.indexOf("#/calc")===0){ view.innerHTML = calcView(); renderCalcResult(); }
  else { view.innerHTML = homeView(); }
  renderNav();
  window.scrollTo(0,0);
  closeSidebar();
}
function applyChrome(){
  document.getElementById("search").placeholder = ui().search;
  document.getElementById("disclaimer").textContent = ui().disclaimer;
  document.getElementById("rights").textContent = ui().rights;
  document.getElementById("brand-sub").textContent = ui().tagline;
  var lt = document.getElementById("langToggle");
  Array.prototype.forEach.call(lt.querySelectorAll("button"), function(btn){
    btn.classList.toggle("on", btn.getAttribute("data-lang")===LANG);
  });
}
function setLang(l){ LANG = l; try{ localStorage.setItem("xlectrical.lang", l); }catch(e){} applyChrome(); render(); }

/* ===== Theme ===== */
function initTheme(){
  var saved; try{ saved = localStorage.getItem("xlectrical.theme"); }catch(e){}
  if(saved){ document.documentElement.setAttribute("data-theme", saved); }
}
function toggleTheme(){
  var cur = document.documentElement.getAttribute("data-theme");
  var next = cur==="dark" ? "light" : (cur==="light" ? "dark" : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark"));
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("xlectrical.theme", next); }catch(e){}
}

/* ===== Sidebar (mobile) ===== */
function openSidebar(){ document.getElementById("sidebar").classList.add("open"); document.getElementById("backdrop").classList.add("show"); }
function closeSidebar(){ document.getElementById("sidebar").classList.remove("open"); document.getElementById("backdrop").classList.remove("show"); }

/* ===== Events ===== */
document.addEventListener("click", function(e){
  var tr = e.target.closest ? e.target.closest(".tr-btn") : null;
  if(tr){ e.preventDefault(); var bid = tr.getAttribute("data-bid"); var b = viewBlocks[bid];
    if(b){ var cur = overrides[bid]||LANG; var next = cur==="en"?"es":"en"; overrides[bid]=next;
      var el = document.querySelector('.block[data-bid="'+bid.replace(/"/g,'')+'"]');
      if(el){ el.outerHTML = blockWrap(bid, b); } }
    return;
  }
  if(e.target.closest("[data-close-results]")){ var box=document.getElementById("results"); box.hidden=true; document.getElementById("search").value=""; }
  if(e.target.closest("#menuBtn")){ openSidebar(); }
  if(e.target.closest("#backdrop")){ closeSidebar(); }
  if(e.target.closest("#themeBtn")){ toggleTheme(); }
  var lb = e.target.closest ? e.target.closest("#langToggle button") : null;
  if(lb){ setLang(lb.getAttribute("data-lang")); }
  var ab = e.target.closest ? e.target.closest(".seg button[data-aud]") : null;
  if(ab){ AUDIENCE = ab.getAttribute("data-aud"); try{ localStorage.setItem("xlectrical.aud", AUDIENCE); }catch(e2){} render(); }
  if(e.target.closest && e.target.closest(".calc-egc-add")){ syncCalc(); CALC.rows.push({ size: egcSize(CALC.egcAmps), qty: 1 }); render(); return; }
  if(e.target.closest && e.target.closest(".calc-add")){ syncCalc(); CALC.rows.push({ size: "12", qty: 1 }); render(); return; }
  var cd = e.target.closest ? e.target.closest(".calc-del") : null;
  if(cd){ syncCalc(); var di = parseInt(cd.getAttribute("data-idx"),10); CALC.rows.splice(di,1); if(!CALC.rows.length) CALC.rows=[{ size:"12", qty:3 }]; render(); return; }
});
document.addEventListener("input", function(e){
  if(e.target.id==="search"){ renderResults(e.target.value); return; }
  if(e.target.classList && e.target.classList.contains("calc-qty")){ syncCalc(); renderCalcResult(); return; }
  if(e.target.id==="calc-egc-amps"){ var amps=Math.max(15,parseInt(e.target.value,10)||15); CALC.egcAmps=amps; var sz=document.getElementById("calc-egc-size"); if(sz) sz.textContent="#"+egcSize(amps); return; }
  if(e.target.classList && e.target.classList.contains("tbl-filter")){
    var q = e.target.value.trim().toLowerCase();
    var tbl = e.target.closest(".tbl");
    var rows = tbl.querySelectorAll("table.data tbody tr");
    var shown = 0;
    Array.prototype.forEach.call(rows, function(r){
      var match = !q || r.textContent.toLowerCase().indexOf(q)>=0;
      r.classList.toggle("hidden", !match); if(match) shown++;
    });
    var lbl = e.target.getAttribute("data-rows") || ui().rows;
    var count = tbl.querySelector(".tbl-count"); if(count){ count.textContent = shown+" "+lbl; }
  }
});
document.addEventListener("change", function(e){
  if(e.target.id==="calc-preset"){ var p=PRESETS[e.target.value]; if(p){ CALC.conduit=p.conduit; CALC.insulation=p.insulation; CALC.rows=p.rows.map(function(r){return {size:r.size,qty:r.qty};}); render(); } return; }
  if(e.target.id==="calc-conduit" || e.target.id==="calc-insulation" || (e.target.classList && e.target.classList.contains("calc-size"))){ syncCalc(); renderCalcResult(); }
});
document.addEventListener("keydown", function(e){ if(e.key==="Escape"){ document.getElementById("results").hidden=true; closeSidebar(); } });
document.addEventListener("focusout", function(e){
  if(e.target.id==="search"){ setTimeout(function(){ document.getElementById("results").hidden=true; }, 180); }
});
window.addEventListener("hashchange", render);

/* ===== Boot ===== */
initTheme();
applyChrome();
render();
</script>
